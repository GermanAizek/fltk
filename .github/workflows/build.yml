  build-riscv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: riscv64-linux, compiler_pkg: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu", c_compiler: riscv64-linux-gnu-gcc, cxx_compiler: riscv64-linux-gnu-g++, run_tests: true }
          - { name: riscv64-elf, compiler_pkg: "gcc-riscv64-unknown-elf libnewlib-riscv64-unknown-elf", c_compiler: riscv64-unknown-elf-gcc, cxx_compiler: riscv64-unknown-elf-g++, run_tests: false, flags: "-march=rv64gc -mabi=lp64d" }
          - { name: riscv32-elf, compiler_pkg: "gcc-riscv64-unknown-elf libnewlib-riscv64-unknown-elf", c_compiler: riscv64-unknown-elf-gcc, cxx_compiler: riscv64-unknown-elf-g++, run_tests: false, flags: "-march=rv32imac -mabi=ilp32" }

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install prerequisites
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ${{ matrix.target.compiler_pkg }} qemu-user-static ninja-build

    - name: Configure CMake
      run: |
        FLAGS="${{ matrix.target.flags }}"
        RUN_TESTS="${{ matrix.target.run_tests }}"
        if [ "$RUN_TESTS" = "true" ]; then
          cmake -B build -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=17 \
            -D CMAKE_CXX_EXTENSIONS=OFF \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=riscv64 \
            -D CMAKE_C_COMPILER=${{ matrix.target.c_compiler }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.target.cxx_compiler }} \
            -D FLTK_USE_SYSTEM_LIBJPEG=OFF \
            -D FLTK_USE_SYSTEM_LIBPNG=OFF \
            -D FLTK_USE_SYSTEM_ZLIB=OFF \
            -D FLTK_BUILD_SHARED_LIBS=OFF \
            -D FLTK_BUILD_TEST=ON \
            -D FLTK_BUILD_EXAMPLES=OFF \
            -D FLTK_BUILD_FORMS=ON \
            -D FLTK_BUILD_GL=OFF \
            -D FLTK_BACKEND_WAYLAND=OFF
        else
          cmake -B build -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=17 \
            -D CMAKE_CXX_EXTENSIONS=OFF \
            -D CMAKE_SYSTEM_NAME=Generic \
            -D CMAKE_C_COMPILER=${{ matrix.target.c_compiler }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.target.cxx_compiler }} \
            -D CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -D CMAKE_C_FLAGS="$FLAGS" \
            -D CMAKE_CXX_FLAGS="$FLAGS" \
            -D FLTK_USE_SYSTEM_LIBJPEG=OFF \
            -D FLTK_USE_SYSTEM_LIBPNG=OFF \
            -D FLTK_USE_SYSTEM_ZLIB=OFF \
            -D FLTK_BUILD_SHARED_LIBS=OFF \
            -D FLTK_BUILD_TEST=OFF \
            -D FLTK_BUILD_EXAMPLES=OFF \
            -D FLTK_BUILD_FORMS=OFF \
            -D FLTK_BUILD_GL=OFF
        fi

    - name: Build
      run: cmake --build build

    - name: Run unit tests via QEMU
      if: matrix.target.run_tests == true
      run: |
        qemu-riscv64-static -L /usr/riscv64-linux-gnu ./build/bin/test/unittests --core


