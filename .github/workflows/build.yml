        -D CMAKE_BUILD_TYPE=$BUILD_TYPE \
        -D CMAKE_CXX_STANDARD=17 \
        -D CMAKE_CXX_EXTENSIONS=OFF \
        -D FLTK_BUILD_TEST=OFF \
        -D FLTK_BUILD_EXAMPLES=OFF

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE


  build-freertos:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install prerequisites
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build

    - name: Checkout FreeRTOS Kernel
      run: |
        git clone --depth 1 https://github.com/FreeRTOS/FreeRTOS-Kernel.git ${{ github.workspace }}/freertos-kernel

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_CXX_STANDARD=17 \
          -D CMAKE_CXX_EXTENSIONS=OFF \
          -D CMAKE_SYSTEM_NAME=Generic \
          -D CMAKE_C_COMPILER=arm-none-eabi-gcc \
          -D CMAKE_CXX_COMPILER=arm-none-eabi-g++ \
          -D CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
          -D CMAKE_C_FLAGS="-mcpu=cortex-m4 -mthumb -I${{ github.workspace }}/freertos-kernel/include -I${{ github.workspace }}/freertos-kernel/portable/GCC/ARM_CM4F" \
          -D CMAKE_CXX_FLAGS="-mcpu=cortex-m4 -mthumb -I${{ github.workspace }}/freertos-kernel/include -I${{ github.workspace }}/freertos-kernel/portable/GCC/ARM_CM4F" \
          -D FLTK_USE_SYSTEM_LIBJPEG=OFF \
          -D FLTK_USE_SYSTEM_LIBPNG=OFF \
          -D FLTK_USE_SYSTEM_ZLIB=OFF \
          -D FLTK_BUILD_SHARED_LIBS=OFF \
          -D FLTK_BUILD_TEST=OFF \
          -D FLTK_BUILD_EXAMPLES=OFF \
          -D FLTK_BUILD_FORMS=OFF \
          -D FLTK_BUILD_GL=OFF

    - name: Build
      run: cmake --build build


  build-zephyr:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:latest

    steps:
    - name: Safe directory
      run: git config --global --add safe.directory "*"

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_CXX_STANDARD=17 \
