        }


  build-bsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: freebsd, version: '14.0', architecture: x86-64 }
          - { name: freebsd, version: '14.0', architecture: arm64 }
          - { name: openbsd, version: '7.5', architecture: x86-64 }
          - { name: openbsd, version: '7.5', architecture: arm64 }
          - { name: netbsd, version: '10.0', architecture: x86-64 }
          - { name: netbsd, version: '10.0', architecture: arm64 }
          - { name: haiku, version: 'r1beta5', architecture: x86-64 }
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build and Test in VM
      uses: cross-platform-actions/action@v1.4.0
      with:
        operating_system: ${{ matrix.os.name }}
        version: ${{ matrix.os.version }}
        architecture: ${{ matrix.os.architecture }}
        run: |
          if [ "${{ matrix.os.name }}" = "freebsd" ]; then
            sudo env IGNORE_OSVERSION=yes pkg update
            sudo env IGNORE_OSVERSION=yes pkg install -y git cmake ninja pkgconf libX11 libXext libXft libXinerama libXcursor libXfixes libXrender mesa-libs libGLU
          elif [ "${{ matrix.os.name }}" = "openbsd" ]; then
            sudo pkg_add -I git cmake ninja
          elif [ "${{ matrix.os.name }}" = "netbsd" ]; then
            sudo pkgin -y update
            sudo pkgin -y install git cmake ninja-build pkgconf libXft libXcursor libXrender
          elif [ "${{ matrix.os.name }}" = "haiku" ]; then
            for i in 1 2 3 4 5; do
              pkgman refresh && break || sleep 3
            done
            pkgman install -y cmake || true
            pkgman install -y ninja || true
          fi

          GENERATOR=""
          if command -v ninja >/dev/null 2>&1; then
            GENERATOR="-G Ninja"
          fi

          cmake -B build $GENERATOR \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=17 \
            -D FLTK_USE_SYSTEM_LIBJPEG=OFF \
            -D FLTK_USE_SYSTEM_LIBPNG=OFF \
            -D FLTK_USE_SYSTEM_ZLIB=OFF \
            -D FLTK_BUILD_FORMS=ON \
            -D FLTK_BUILD_GL=ON \
            -D FLTK_BUILD_SHARED_LIBS=OFF

          cmake --build build

          ./build/bin/test/unittests --core

  build-sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, memory, thread]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: install prerequisites
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
        libjpeg-dev \
        libasound2-dev \
        libglew-dev \
        libglu1-mesa-dev \
        libcairo2-dev \
        libx11-dev \
        libxcursor-dev \
        libxft-dev \
        libxinerama-dev \
        ninja-build \
        clang

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake $GITHUB_WORKSPACE \
        -G Ninja \
        -D CMAKE_BUILD_TYPE=Debug \
        -D CMAKE_CXX_STANDARD=17 \
        -D CMAKE_CXX_EXTENSIONS=OFF \
        -D CMAKE_C_FLAGS_INIT="-Wall -Wunused -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
        -D CMAKE_CXX_FLAGS_INIT="-Wall -Wunused -Wsuggest-override -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
        -D CMAKE_EXE_LINKER_FLAGS_INIT="-fsanitize=${{ matrix.sanitizer }}" \
        -D CMAKE_SHARED_LINKER_FLAGS_INIT="-fsanitize=${{ matrix.sanitizer }}" \
        -D CMAKE_MODULE_LINKER_FLAGS_INIT="-fsanitize=${{ matrix.sanitizer }}" \
        -D FLTK_USE_SYSTEM_LIBJPEG=OFF \
        -D FLTK_USE_SYSTEM_LIBPNG=OFF \
        -D FLTK_USE_SYSTEM_ZLIB=OFF \
        -D FLTK_BACKEND_WAYLAND=OFF \
        -D FLTK_BUILD_SHARED_LIBS:BOOL=OFF \
        -D FLTK_BUILD_FORMS=ON \
        -D FLTK_BUILD_GL=ON \
        -D FLTK_OPTION_CAIRO_WINDOW=OFF

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      env:
        MSAN_OPTIONS: "poison_in_dtor=0"
      run: cmake --build .

    - name: Unittest
      working-directory: ${{github.workspace}}/build
      shell: bash
      env:
        ASAN_OPTIONS: "detect_leaks=0"
        MSAN_OPTIONS: "poison_in_dtor=0"
      run: ./bin/test/unittests --core

  build-alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
    - name: Install prerequisites
      run: |
        sed -i 's/^#//g' /etc/apk/repositories || true
        apk update
        apk add --no-cache \
          bash \
          build-base \
          cmake \
          ninja \
          git \
          nodejs \
          pkgconf \
          alsa-lib-dev \
          fontconfig-dev \
          freetype-dev \
          glu-dev \
          glew-dev \
          mesa-dev \
          libx11-dev \
          libxcursor-dev \
          libxext-dev \
          libxfixes-dev \
          libxft-dev \
          libxinerama-dev \
          libxrender-dev \
          libjpeg-turbo-dev \
          libpng-dev \
          zlib-dev \
          cairo-dev \
          pango-dev \
          wayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          dbus-dev \
          libdecor-dev
        git config --global --add safe.directory "*"

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
        -D CMAKE_BUILD_TYPE=$BUILD_TYPE \
        -D CMAKE_CXX_STANDARD=17 \
        -D CMAKE_CXX_EXTENSIONS=OFF \
        -D CMAKE_C_FLAGS_INIT="-Wall -Wunused" \
        -D CMAKE_CXX_FLAGS_INIT="-Wall -Wunused -Wsuggest-override" \
        -D FLTK_BUILD_SHARED_LIBS:BOOL=ON \
        -D FLTK_BUILD_GL=ON \
        -D FLTK_BUILD_FORMS=ON

    - name: Build
      run: cmake --build build

    - name: Unittest
      run: ./build/bin/test/unittests --core

  build-tinycore:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build and Test in Tiny Core Linux
      run: |
        chmod -R a+rwX ${{ github.workspace }}
        docker run --rm -v ${{ github.workspace }}:/work -w /work tatsushid/tinycore:11.0-x86_64 sh -c '
          tce-load -wic compiletc cmake \
            Xorg-7.7-dev \
            libX11-dev libXext-dev libXft-dev libXinerama-dev libXcursor-dev \
            libXfixes-dev libXrender-dev fontconfig-dev freetype-dev \
            libGL-dev mesa-dev glu-dev || true
          cmake -B build-tc \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=17 \
            -D FLTK_BUILD_SHARED_LIBS=OFF \
            -D FLTK_BUILD_GL=OFF \
            -D FLTK_BUILD_FORMS=ON
          cmake --build build-tc
          XDG_CONFIG_HOME=/work/build-tc/.config HOME=/work/build-tc ./build-tc/bin/test/unittests --core
        '


